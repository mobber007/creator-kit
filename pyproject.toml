[project]
name = "creator-kit"
version = "0.1.0"
description = "Tools for making and checking short videos, pictures and the numbers behind them."
requires-python = ">=3.11,<3.13"
dependencies = [
  "pillow>=10",
  "numpy>=1.26",
  "pandas>=2.1",
  "faster-whisper>=1.0",
  # Intel Macs: onnxruntime publishes no wheel past 1.23.2 for them
  "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.uv]
package = false
